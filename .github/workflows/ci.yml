name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PixHub.slnx

      - name: Verificar formatação (.editorconfig)
        run: dotnet format PixHub.slnx --verify-no-changes --no-restore

      - name: Build (Release, warnings como erro)
        run: dotnet build PixHub.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test PixHub.slnx --no-build --configuration Release
          --logger "trx"
          --results-directory ./TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7